<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: rounded square with gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2B6CB0"/>
      <stop offset="100%" style="stop-color:#1A365D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- SLB text at top -->
  <text x="256" y="100" font-family="Arial, sans-serif" font-size="72" font-weight="bold" 
        fill="white" text-anchor="middle" dominant-baseline="middle" letter-spacing="6">SLB</text>
  
  <!-- Shopping bag icon -->
  <path d="M170 210 L170 380 C170 393 180 403 193 403 L319 403 C332 403 342 393 342 380 L342 210 Z" 
        fill="none" stroke="white" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bag handles -->
  <path d="M212 210 L212 175 C212 152 232 132 256 132 C280 132 300 152 300 175 L300 210" 
        fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Dollar sign in bag -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="90" font-weight="bold" 
        fill="white" text-anchor="middle" dominant-baseline="middle">$</text>
  
  <!-- "POS" text at bottom -->
  <text x="256" y="468" font-family="Arial, sans-serif" font-size="52" font-weight="bold" 
        fill="rgba(255,255,255,0.9)" text-anchor="middle" dominant-baseline="middle" letter-spacing="10">POS</text>
</svg>
