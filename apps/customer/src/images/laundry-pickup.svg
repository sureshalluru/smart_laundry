<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background circle -->
  <circle cx="200" cy="150" r="130" fill="#EBF8FF"/>
  
  <!-- Road -->
  <rect x="40" y="220" width="320" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="80" y="222" width="20" height="4" rx="2" fill="#CBD5E0"/>
  <rect x="140" y="222" width="20" height="4" rx="2" fill="#CBD5E0"/>
  <rect x="200" y="222" width="20" height="4" rx="2" fill="#CBD5E0"/>
  <rect x="260" y="222" width="20" height="4" rx="2" fill="#CBD5E0"/>
  
  <!-- Delivery Van Body -->
  <rect x="100" y="155" width="160" height="65" rx="8" fill="#4299E1"/>
  <rect x="100" y="155" width="160" height="20" rx="8" fill="#3182CE"/>
  
  <!-- Van cabin/front -->
  <path d="M260 170 L290 170 C295 170 300 175 300 180 L300 220 L260 220 L260 170Z" fill="#2B6CB0"/>
  <rect x="265" y="178" width="28" height="22" rx="4" fill="#BEE3F8"/>
  
  <!-- Van back door -->
  <rect x="105" y="175" width="50" height="45" rx="3" fill="#2B6CB0"/>
  <rect x="110" y="180" width="18" height="35" rx="2" fill="#BEE3F8" opacity="0.5"/>
  <rect x="132" y="180" width="18" height="35" rx="2" fill="#BEE3F8" opacity="0.5"/>
  
  <!-- Van text area -->
  <rect x="160" y="182" width="90" height="28" rx="4" fill="white" opacity="0.9"/>
  <text x="205" y="200" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2B6CB0" text-anchor="middle">FREE PICKUP</text>
  <text x="205" y="212" font-family="Arial, sans-serif" font-size="8" fill="#4299E1" text-anchor="middle">&amp; DELIVERY</text>
  
  <!-- Wheels -->
  <circle cx="140" cy="222" r="14" fill="#2D3748"/>
  <circle cx="140" cy="222" r="7" fill="#718096"/>
  <circle cx="140" cy="222" r="3" fill="#2D3748"/>
  <circle cx="275" cy="222" r="14" fill="#2D3748"/>
  <circle cx="275" cy="222" r="7" fill="#718096"/>
  <circle cx="275" cy="222" r="3" fill="#2D3748"/>
  
  <!-- Laundry bag on top -->
  <ellipse cx="180" cy="148" rx="22" ry="18" fill="#63B3ED"/>
  <path d="M165 135 C165 128 175 122 180 122 C185 122 195 128 195 135" stroke="#2B6CB0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="175" cy="145" r="3" fill="white" opacity="0.6"/>
  <circle cx="185" cy="150" r="2" fill="white" opacity="0.4"/>
  
  <!-- T-shirt icon on bag -->
  <path d="M175 143 L178 140 L180 141 L182 140 L185 143 L183 144 L183 151 L177 151 L177 144 Z" fill="white" opacity="0.8"/>
  
  <!-- House -->
  <rect x="30" y="100" width="50" height="50" rx="3" fill="#F7FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <polygon points="30,100 55,78 80,100" fill="#4299E1"/>
  <rect x="47" y="120" width="16" height="30" rx="2" fill="#90CDF4"/>
  <circle cx="60" cy="136" r="1.5" fill="#2B6CB0"/>
  <rect x="35" y="110" width="10" height="10" rx="1" fill="#BEE3F8"/>
  
  <!-- Location pin -->
  <g transform="translate(50, 55)">
    <path d="M5 0 C-2 0 -7 5 -7 11 C-7 19 5 28 5 28 C5 28 17 19 17 11 C17 5 12 0 5 0Z" fill="#E53E3E"/>
    <circle cx="5" cy="11" r="4" fill="white"/>
  </g>
  
  <!-- Motion lines -->
  <line x1="85" y1="185" x2="70" y2="185" stroke="#90CDF4" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="195" x2="65" y2="195" stroke="#90CDF4" stroke-width="2" stroke-linecap="round"/>
  <line x1="85" y1="205" x2="72" y2="205" stroke="#90CDF4" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Sparkles -->
  <g fill="#4299E1">
    <path d="M320 90 L322 95 L327 97 L322 99 L320 104 L318 99 L313 97 L318 95Z"/>
    <path d="M340 120 L341 123 L344 124 L341 125 L340 128 L339 125 L336 124 L339 123Z" opacity="0.6"/>
    <path d="M90 70 L91 73 L94 74 L91 75 L90 78 L89 75 L86 74 L89 73Z" opacity="0.7"/>
  </g>
</svg>
