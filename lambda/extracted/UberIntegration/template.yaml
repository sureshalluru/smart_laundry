# This AWS SAM template has been generated from your function's configuration.
# If your function has one or more triggers, note that the AWS resources
# associated with these triggers aren't fully specified in this template and
# include placeholder values. Open this template in AWS Infrastructure Composer
# or your favorite IDE and modify it to specify a serverless application with
# other AWS resources.
#
# - SAM automatically generates permissions to interact with the resources
#   defined in this template. If your function needs additional permissions, add
#   Policies to the AWS::Serverless::Function resource.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model (SAM) template describing your function.
Resources:
  UberIntegration:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      CodeUri: ./src
      Description: ''
      Environment:
        Variables:
          GOOGLE_GEOCODE_URL: https://maps.googleapis.com/maps/api/geocode/json
          DB_PORT: '5432'
          GOOGLE_MAPS_API_KEY: YOUR_GOOGLE_MAPS_API_KEY
          DB_USER: smart_laundry
          UBER_AUTH_URL: https://auth.uber.com/oauth/v2/token
          DB_NAME: smart_laundry
          UBER_SCOPE: eats.deliveries
          DB_HOST: YOUR_DB_HOST
          DB_PASSWORD: YOUR_DB_PASSWORD
      EphemeralStorage:
        Size: 512
      Handler: lambda_function.lambda_handler
      Layers:
        - arn:aws:lambda:us-east-1:471112833382:layer:requestsLayer:1
        - arn:aws:lambda:us-east-1:471112833382:layer:pytz_python39_layer:1
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/UberIntegration
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: python3.13
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Tags: {}
      Timeout: 10
      Tracing: PassThrough
      Events:
        Trigger1Event:
          Type: Api
          Properties:
            Method: POST
            Path: /api/uber/quote
        Trigger2Event:
          Type: Api
          Properties:
            Method: POST
            Path: /api/uber/delivery
        Trigger3Event:
          Type: Api
          Properties:
            Method: GET
            Path: /api/uber/delivery/{id}
        Trigger4Event:
          Type: Api
          Properties:
            Method: POST
            Path: /api/uber/webhook
        Trigger5Event:
          Type: Api
          Properties:
            Method: POST
            Path: /api/uber/cancel-uber-delivery
        Trigger6Event:
          Type: HttpApi
          Properties:
            Method: ANY
            Path: /MyResource
        Trigger7Event:
          Type: Api
          Properties:
            Method: POST
            Path: /api/uber/uberQuoteEstimate
        Trigger8Event:
          Type: Schedule
          Properties:
            Schedule: cron(0/2 * * * ? *)
