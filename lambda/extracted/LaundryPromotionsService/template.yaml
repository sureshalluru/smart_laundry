AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: An AWS Serverless Application Model (SAM) template describing your function.
Resources:
  LaundryPromotionsService:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - x86_64
      CodeUri: ./src
      Description: ''
      Environment:
        Variables:
          DB_PORT: '5432'
          DB_USER: smart_laundry
          DB_NAME: smart_laundry
          DB_HOST: CHANGE_ME
          DB_PASSWORD: CHANGE_ME
      EphemeralStorage:
        Size: 512
      Handler: lambda_function.lambda_handler
      Layers:
        - arn:aws:lambda:us-east-1:471112833382:layer:psycopg2-py313:1
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/LaundryPromotionsService
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: python3.13
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Tags: {}
      Timeout: 10
      Tracing: PassThrough
      Events:
        Trigger1Event:
          Type: Api
          Properties:
            Method: GET
            Path: /api/admin/promotions-info
        Trigger2Event:
          Type: Api
          Properties:
            Method: POST
            Path: /api/admin/manage-promotions
